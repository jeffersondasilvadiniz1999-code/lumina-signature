<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Definir nova senha — Lumina Signature</title><link rel="stylesheet" href="/static/style.css"></head><body><header><a class="brand" href="/">Lumina <span>Signature</span></a></header><main class="wrap"><div class="box"><h1>Definir nova senha</h1><form class="form" id="form"><input type="password" id="password" placeholder="Nova senha" autocomplete="new-password" minlength="10" required><input type="password" id="confirmation" placeholder="Confirmar senha" autocomplete="new-password" required><button class="btn">Confirmar</button></form></div></main><script src="/static/app.js?v=c0a705197ae1"></script><script>form.onsubmit=async e=>{e.preventDefault();try{await api('/api/password/reset',{method:'POST',body:JSON.stringify({token:location.hash.slice(1),password:password.value,confirm:confirmation.value})});location.href='/account'}catch(error){showError(error)}};</script></body></html>
